name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Workload Identity Federation: NO long-lived JSON keys committed.
permissions:
  contents: read
  id-token: write   # required for OIDC token to GCP

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  NODE_VERSION: "20.11.1"
  GCP_REGION: us-central1
  GCP_PROJECT_NUMBER: "687675138316"           # for the deterministic *.run.app URL
  GCP_AR_REPO: whyc                            # Artifact Registry repo
  CLOUD_RUN_SERVICE_API: whyc-api
  CLOUD_RUN_SERVICE_WEB: whyc-web
  CLOUD_RUN_JOB_PIPELINE_V2: pipeline-kickoff-v2

jobs:

  # -------------------------------------------------------------------------
  # 1. Authenticate via WIF + build/push images (api · web · jobs)
  # -------------------------------------------------------------------------
  build-and-push:
    name: build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - id: auth
        name: Auth to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_AR_REPO }}/whyc-api:${{ steps.tag.outputs.image_tag }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_AR_REPO }}/whyc-api:latest
          cache-from: type=gha,scope=whyc-api
          cache-to: type=gha,scope=whyc-api,mode=max

      - name: Build & push Web image
        if: hashFiles('apps/web/package.json') != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE=https://${{ env.CLOUD_RUN_SERVICE_API }}-${{ env.GCP_PROJECT_NUMBER }}.${{ env.GCP_REGION }}.run.app/api/v1
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_AR_REPO }}/whyc-web:${{ steps.tag.outputs.image_tag }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_AR_REPO }}/whyc-web:latest
          cache-from: type=gha,scope=whyc-web
          cache-to: type=gha,scope=whyc-web,mode=max

      - name: Build & push Jobs image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.jobs
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_AR_REPO }}/whyc-jobs:${{ steps.tag.outputs.image_tag }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_AR_REPO }}/whyc-jobs:latest
          cache-from: type=gha,scope=whyc-jobs
          cache-to: type=gha,scope=whyc-jobs,mode=max

  # -------------------------------------------------------------------------
  # 2. Apply DB migrations (prisma migrate deploy) BEFORE flipping traffic
  # -------------------------------------------------------------------------
  migrate:
    name: prisma migrate deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # No `version:` here — it conflicts with the `packageManager` field in
      # package.json (pnpm/action-setup@v4 errors on "Multiple versions of pnpm
      # specified"). ci.yml does the same: rely on packageManager: pnpm@9.12.0.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fetch DB URL from Secret Manager
        id: dbsecret
        run: |
          DB_URL=$(gcloud secrets versions access latest --secret=whyc-database-url-writer --project="${{ secrets.GCP_PROJECT_ID }}")
          echo "::add-mask::$DB_URL"
          # The stored URL is the Cloud SQL unix-socket form
          # (…@localhost/whyc?host=/cloudsql/<conn>&schema=public). From CI we reach
          # the instance over the TCP auth proxy on 127.0.0.1:5432, so drop the
          # query string and point the host at the proxy. The credentials part
          # (://user:pass@) is left untouched.
          BASE_NOQ=$(printf '%s' "$DB_URL" | sed -E 's#\?.*$##')
          PROXY_URL="$(printf '%s' "$BASE_NOQ" | sed -E 's#@localhost/#@127.0.0.1:5432/#')?schema=public"
          echo "::add-mask::$PROXY_URL"
          echo "DATABASE_URL=$PROXY_URL" >> "$GITHUB_ENV"

      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -fsSL -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.11.0/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --address 127.0.0.1 --port 5432 \
            "${{ secrets.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:whyc-pg" &
          for i in {1..30}; do nc -z 127.0.0.1 5432 && break || sleep 1; done

      - name: Run prisma migrate deploy
        run: pnpm exec prisma migrate deploy --schema=prisma/schema.prisma

  # -------------------------------------------------------------------------
  # 3. Deploy whyc-api Cloud Run service
  # -------------------------------------------------------------------------
  deploy-api:
    name: deploy whyc-api
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate]
    timeout-minutes: 10
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      - id: deploy
        name: gcloud run deploy
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_AR_REPO }}/whyc-api:${{ needs.build-and-push.outputs.image_tag }}"
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE_API }} \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --image="$IMAGE" \
            --service-account="whyc-api-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --ingress=all \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=5 \
            --cpu=1 \
            --memory=512Mi \
            --concurrency=80 \
            --timeout=30 \
            --port=8080 \
            --set-cloudsql-instances="${{ secrets.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:whyc-pg" \
            --set-secrets="DATABASE_URL=whyc-database-url:latest,GEMINI_API_KEY=whyc-gemini-api-key:latest,ARIZE_PHOENIX_API_KEY=whyc-arize-phoenix-api-key:latest,ARIZE_PHOENIX_ENDPOINT=whyc-arize-phoenix-endpoint:latest,CORS_ALLOWED_ORIGIN=whyc-cors-allowed-origin:latest,JUDGE_PROMPT_VERSION=whyc-judge-prompt-version:latest" \
            --set-env-vars="NODE_ENV=production,WEB_BASE_URL=https://${{ env.CLOUD_RUN_SERVICE_WEB }}-${{ env.GCP_PROJECT_NUMBER }}.${{ env.GCP_REGION }}.run.app,RATE_LIMIT_COMPANIES_PER_MIN=60,RATE_LIMIT_HEALTH_PER_MIN=600"
          URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE_API }} \
                  --project="${{ secrets.GCP_PROJECT_ID }}" \
                  --region="${{ env.GCP_REGION }}" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "deployed whyc-api → $URL"

      - name: Smoke /api/v1/health
        run: |
          set -e
          for i in {1..20}; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.deploy.outputs.url }}/api/v1/health" || true)
            if [ "$CODE" = "200" ]; then echo "health OK"; exit 0; fi
            echo "attempt $i: $CODE"; sleep 3
          done
          echo "::error::health check failed"; exit 1

  # -------------------------------------------------------------------------
  # 4. Deploy whyc-web Cloud Run service
  # -------------------------------------------------------------------------
  deploy-web:
    name: deploy whyc-web
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-api]
    timeout-minutes: 10
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: deploy
        name: gcloud run deploy whyc-web
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_AR_REPO }}/whyc-web:${{ needs.build-and-push.outputs.image_tag }}"
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE_WEB }} \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --image="$IMAGE" \
            --service-account="whyc-web-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --ingress=all \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=5 \
            --cpu=1 \
            --memory=512Mi \
            --concurrency=80 \
            --timeout=30 \
            --port=3000 \
            --set-env-vars="NODE_ENV=production,NEXT_PUBLIC_API_BASE=https://${{ env.CLOUD_RUN_SERVICE_API }}-${{ env.GCP_PROJECT_NUMBER }}.${{ env.GCP_REGION }}.run.app/api/v1"
          URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE_WEB }} \
                  --project="${{ secrets.GCP_PROJECT_ID }}" \
                  --region="${{ env.GCP_REGION }}" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "deployed whyc-web → $URL"

  # -------------------------------------------------------------------------
  # 5. Deploy / update the v2 pipeline Cloud Run Job (manifest apply)
  # -------------------------------------------------------------------------
  deploy-jobs:
    name: deploy pipeline-kickoff-v2 job
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Render & apply pipeline-kickoff-v2.yaml
        run: |
          MANIFEST=deploy/cloud-run/jobs/pipeline-kickoff-v2.yaml
          OUT=/tmp/pipeline-kickoff-v2.rendered.yaml
          sed -e "s/PROJECT_ID/${{ secrets.GCP_PROJECT_ID }}/g" \
              -e "s/REGION/${{ env.GCP_REGION }}/g" \
              -e "s/GIT_SHA/${{ needs.build-and-push.outputs.image_tag }}/g" \
              "$MANIFEST" > "$OUT"
          echo "----- rendered manifest -----"; cat "$OUT"; echo "-----------------------------"
          gcloud run jobs replace "$OUT" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}"
          echo "applied Cloud Run job ${{ env.CLOUD_RUN_JOB_PIPELINE_V2 }}"

  # -------------------------------------------------------------------------
  # 6. Post-deploy smoke against the live Cloud Run service URLs
  # -------------------------------------------------------------------------
  smoke:
    name: post-deploy smoke
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-web]
    timeout-minutes: 5
    steps:
      - name: Smoke API endpoints
        run: |
          set -e
          BASE="${{ needs.deploy-api.outputs.url }}"
          for path in "/api/v1/health" "/api/v1/stats"; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$BASE$path")
            if [ "$CODE" != "200" ]; then echo "::error::$path → $CODE"; exit 1; fi
            echo "$path OK"
          done
      - name: Smoke web landing
        run: |
          set -e
          WEB="${{ needs.deploy-web.outputs.url }}"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$WEB/")
          if [ "$CODE" != "200" ]; then echo "::error::web / → $CODE"; exit 1; fi
          echo "web / OK"
          # Preview hygiene: per-run preview shells set X-Robots-Tag noindex (deploy-v2);
          # the primary web surface should be indexable, so just report.
          XRT=$(curl -sI "$WEB/" | awk -F': *' 'tolower($1)=="x-robots-tag" {print $2}' | tr -d '\r')
          [ -n "$XRT" ] && echo "::notice::web landing X-Robots-Tag=$XRT" || echo "web landing has no X-Robots-Tag (expected for primary surface)"
