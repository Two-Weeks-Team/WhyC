name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Workload Identity Federation: NO long-lived JSON keys committed.
permissions:
  contents: read
  id-token: write   # required for OIDC token to GCP

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  NODE_VERSION: "20.11.1"
  PNPM_VERSION: "9.1.0"
  GCP_REGION: us-central1
  GCP_AR_REPO: whyc                            # Artifact Registry repo
  CLOUD_RUN_SERVICE_API: whyc-api
  CLOUD_RUN_SERVICE_WEB: whyc-web

jobs:

  # -------------------------------------------------------------------------
  # 1. Authenticate via WIF + build/push images
  # -------------------------------------------------------------------------
  build-and-push:
    name: build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - id: auth
        name: Auth to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_AR_REPO }}/whyc-api:${{ steps.tag.outputs.image_tag }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_AR_REPO }}/whyc-api:latest
          cache-from: type=gha,scope=whyc-api
          cache-to: type=gha,scope=whyc-api,mode=max

      - name: Build & push Web image
        if: hashFiles('apps/web/package.json') != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE=https://whyc.example/api/v1
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_AR_REPO }}/whyc-web:${{ steps.tag.outputs.image_tag }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_AR_REPO }}/whyc-web:latest
          cache-from: type=gha,scope=whyc-web
          cache-to: type=gha,scope=whyc-web,mode=max

  # -------------------------------------------------------------------------
  # 2. Apply DB migrations (prisma migrate deploy) BEFORE flipping traffic
  # -------------------------------------------------------------------------
  migrate:
    name: prisma migrate deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fetch DB URL from Secret Manager
        id: dbsecret
        run: |
          DB_URL=$(gcloud secrets versions access latest --secret=whyc-database-url-writer)
          echo "::add-mask::$DB_URL"
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -fsSL -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.11.0/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --address 127.0.0.1 --port 5432 \
            "${{ secrets.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:whyc-pg" &
          # wait for proxy
          for i in {1..30}; do nc -z 127.0.0.1 5432 && break || sleep 1; done

      - name: Run prisma migrate deploy
        run: pnpm exec prisma migrate deploy --schema=prisma/schema.prisma

  # -------------------------------------------------------------------------
  # 3. Deploy whyc-api Cloud Run service
  # -------------------------------------------------------------------------
  deploy-api:
    name: deploy whyc-api
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate]
    timeout-minutes: 10
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      - id: deploy
        name: gcloud run deploy
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_AR_REPO }}/whyc-api:${{ needs.build-and-push.outputs.image_tag }}"
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE_API }} \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --image="$IMAGE" \
            --service-account="whyc-api-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --ingress=internal-and-cloud-load-balancing \
            --min-instances=1 \
            --max-instances=5 \
            --cpu=1 \
            --memory=512Mi \
            --no-cpu-throttling \
            --concurrency=80 \
            --timeout=30 \
            --port=8080 \
            --set-cloudsql-instances="${{ secrets.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:whyc-pg" \
            --set-secrets="DATABASE_URL=whyc-database-url:latest,GEMINI_API_KEY=whyc-gemini-api-key:latest,ARIZE_PHOENIX_API_KEY=whyc-phoenix-api-key:latest" \
            --set-env-vars="NODE_ENV=production,PORT=8080,ARIZE_PHOENIX_ENDPOINT=https://app.phoenix.arize.com,CORS_ALLOWED_ORIGIN=https://whyc.example,WEB_BASE_URL=https://whyc.example,RATE_LIMIT_COMPANIES_PER_MIN=60,RATE_LIMIT_HEALTH_PER_MIN=600"
          URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE_API }} \
                  --region="${{ env.GCP_REGION }}" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke /api/v1/health
        run: |
          set -e
          for i in {1..20}; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.deploy.outputs.url }}/api/v1/health" || true)
            if [ "$CODE" = "200" ]; then echo "health OK"; exit 0; fi
            echo "attempt $i: $CODE"; sleep 3
          done
          echo "::error::health check failed"; exit 1

  # -------------------------------------------------------------------------
  # 4. Deploy whyc-web Cloud Run service
  # -------------------------------------------------------------------------
  deploy-web:
    name: deploy whyc-web
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-api]
    if: hashFiles('apps/web/package.json') != ''
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: gcloud run deploy whyc-web
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_AR_REPO }}/whyc-web:${{ needs.build-and-push.outputs.image_tag }}"
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE_WEB }} \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --image="$IMAGE" \
            --service-account="whyc-web-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --ingress=internal-and-cloud-load-balancing \
            --min-instances=1 \
            --max-instances=5 \
            --cpu=1 \
            --memory=512Mi \
            --no-cpu-throttling \
            --concurrency=80 \
            --timeout=30 \
            --port=3000 \
            --set-env-vars="NODE_ENV=production,PORT=3000,NEXT_PUBLIC_API_BASE=https://whyc.example/api/v1"

  # -------------------------------------------------------------------------
  # 5. Post-deploy smoke against the public LB hostname
  # -------------------------------------------------------------------------
  smoke:
    name: post-deploy smoke
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-web]
    timeout-minutes: 5
    steps:
      - name: Smoke public endpoints
        run: |
          set -e
          BASE="${{ vars.WHYC_PUBLIC_BASE_URL || 'https://whyc.example' }}"
          for path in "/api/v1/health" "/api/v1/stats"; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$BASE$path")
            if [ "$CODE" != "200" ]; then echo "::error::$path → $CODE"; exit 1; fi
            echo "$path OK"
          done
          # Preview hygiene assertion (X-Robots-Tag injection at LB)
          XRT=$(curl -sI "$BASE/" | awk -F': *' 'tolower($1)=="x-robots-tag" {print $2}' | tr -d '\r')
          if [ -z "$XRT" ]; then echo "::warning::X-Robots-Tag missing on landing"; fi
