openapi: 3.1.0
info:
  title: WhyC Public Read API
  version: 1.0.0
  summary: |
    WhyC — "While they hire, we ship."
    Read-only public JSON API exposing curated YC companies, autonomous WhyC pipeline
    runs (Analyze → Go/No-Go → Develop → Deploy → Self-Improve), Phoenix audit
    trail, and a deterministic spec-fit score per run.
  description: |
    This API is **read-only**. There are no user accounts, no submissions, no billing.
    Internal scrape and pipeline jobs run as Cloud Run **batch jobs** and are not
    exposed here (see SPEC.md §9 "Internal cron jobs").

    ### URL versioning (H-D1)
    All endpoints are mounted under `/api/v1/` (and `/v1/` short form below).
    Future incompatible changes will mount at `/api/v2/`. The judge prompt
    sub-resource follows the same prefix scheme: `/api/v1/judge/prompts/{version}`
    where `{version}` is the prompt-internal version label (e.g. `v1`).

    ### Constraints encoded
    - **M4 (superseded 2026-05-07)**: company `name` is text only — no `logo_url`
      field exists anywhere. When `description.text` is set, the schema enforces
      `description.source_url` via the nested `CompanyDescription` schema and a
      Postgres CHECK constraint (B11).
    - **M6**: every preview deploy URL has `expires_at` (24h TTL); served with
      `noindex`. Deploy URLs are revoked at the network ingress layer (Cloud
      Armor time-bound rule) in addition to the DB flag (see B10 / SPEC.md §10).
    - **M7**: every run has `iter_limit` (≤7) and `cost_limit_cents` (≤500) ceilings.
    - **M8**: company `takedown_state` is exposed; 1h SLA enforced server-side.
    - **M10**: judge prompt v1 is served verbatim at `/api/v1/judge/prompts/v1`.
    - **M11**: spec-fit formula is deterministic — see SPEC.md §4.
    - **M12**: stable run/iteration schema with `parent_iter_id` for regen lineage.
    - **M19**: Phoenix MCP is queried by the agent itself; the API only **reads**
      stored Phoenix trace IDs (no live MCP proxying — `/audit` is a pure DB
      read, see B9).

    ### Errors
    All non-2xx responses use `application/problem+json` (RFC 7807) and include
    a closed-vocabulary `code` extension (B3 + SPEC.md §8.1 error catalog).

    ### Pagination (H-D2)
    Cursor-based: `?cursor=<opaque>&limit=<int>`. Cursor is
    `base64url(JSON({k, id}))` where `k` is the sort-key value tuple and `id`
    is the row-id tiebreaker (B8). All list endpoints use the reusable `Page`
    envelope — `data` + `next_cursor`/`prev_cursor` + `window` +
    `applied_sort` + `available_sorts` + `server_time`. `limit` defaults to 50,
    max 200.

    ### Caching (B5 + H-P2 + H-P3)
    Every cacheable GET emits a strong `ETag`. Clients SHOULD send
    `If-None-Match` on revalidation; servers respond `304 Not Modified` with
    `ETag` and `Cache-Control` headers and an empty body.

    **ETag derivation strategy (B5):**
    - Terminal-state runs and the judge prompt: SHA-256 of the canonical JSON
      body (immutable content hash).
    - Single non-terminal entities (`/companies/{slug}`, in-flight `/runs/{id}`):
      `(resource_id, max(meaningful_updated_at))` where `meaningful_updated_at`
      EXPLICITLY EXCLUDES `last_hires_check_at` (which churns on the 6h cron and
      would invalidate cache without semantic change).
    - Collections (`/companies`, `/batches`, `/comments`, …):
      `(filter_hash, max(meaningful_updated_at) over the result page, total_estimate_bucket)`.

    **Per-endpoint Cache-Control matrix (H-P2):**
    | Endpoint | Cache-Control |
    |---|---|
    | `/health` | `no-store` |
    | `/stats` | `public, max-age=3600, stale-while-revalidate=86400` |
    | `/judge/prompts/{version}` | `public, max-age=31536000, immutable` |
    | `/runs/{id}` (terminal status) | `public, max-age=31536000, immutable` |
    | `/runs/{id}` (non-terminal) | `public, max-age=30` |
    | `/companies`, `/companies/{slug}`, `/comments`, `/batches`, `/batches/{id}`, `/companies/{slug}/runs`, `/runs/{id}/iterations` | `public, max-age=60` |
    | `/iterations/{id}/audit` | `public, max-age=300` |

    ### Rate limiting (H-S4)
    Cloud Armor enforces 60 req/min/IP on `/api/v1/companies*` and `/api/v1/runs*`,
    600 req/min/IP on `/api/v1/health` and `/api/v1/stats`. All GETs return `429`
    with a `Retry-After` header on rate-limit hits.

    ### Locale & currency (H-A4 / H-I1 / SC4)
    User-visible string fields that contain natural-language content are
    structured as `{ text, language }` objects with BCP-47 language tags
    (default `en`). Numeric monetary fields carry a sibling `currency_code`
    (ISO 4217, fixed `USD` in v1). All datetimes are ISO 8601 UTC with a
    trailing `Z`; responses include a `server_time` envelope hint where
    relevant. Migration anchor for currency rolls is documented in SPEC.md §4.

    ### Screen-reader accessibility (B1 / B2 / H-A1 / H-A3)
    - Every numeric receipts field documents canonical SR-friendly phrasing
      in its `description` (e.g. "Render as `<X> dollars and <Y> cents` for
      screen readers, never as `$0.04`.").
    - `RunSummary.spec_fit_state` exposes a coarse SR-determinable label
      alongside the float `final_spec_fit`, with a canonical aria-label
      template documented in the schema description.
    - `Company.name_aria_label` and `name_pronunciation` carry pronunciation
      hints for hard-to-pronounce real YC company names.
    - List responses echo `applied_sort` and `available_sorts` so SR users can
      announce sort state.

    ### CORS posture (SC7 medium)
    `Access-Control-Allow-Origin: https://whyc.example` (single origin in v1;
    no wildcard). `Access-Control-Allow-Methods: GET, OPTIONS` (no writes).
    No credentials. Preflight cached 1h.

  contact:
    name: WhyC abuse / takedown
    email: abuse@whyc.example
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: https://whyc.example/api/v1
    description: Production (versioned)
  - url: http://localhost:3000/api/v1
    description: Local dev

tags:
  - name: meta
    description: Liveness and public stats
  - name: catalog
    description: Batches and companies
  - name: pipeline
    description: Runs, iterations, audit
  - name: judge
    description: LLM-as-judge prompt registry
  - name: social
    description: Read-only seed reactions

paths:
  /health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Liveness
      description: |
        Returns 200 if the web tier and DB are reachable. 503 indicates DB
        unreachable. This endpoint MUST NOT depend on Phoenix Cloud — Phoenix
        SaaS outages are reported through `phoenix_reachable=false` (cached
        probe value) plus a degraded-mode banner on the dashboard, never
        through 503.
      security: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              schema: { type: string }
              example: 'no-store'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Default' }

  /stats:
    get:
      tags: [meta]
      operationId: getPublicStats
      summary: Public ledger (landing-page receipts)
      description: |
        Aggregate stats for the receipts band on the landing page. Numbers
        only; no per-company information. Backed by `PublicStatsSnapshot`
        (rebuilt nightly), so the request path is a single-row DB read.
      security: []
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control:
              schema: { type: string }
              example: 'public, max-age=3600, stale-while-revalidate=86400'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicStats' }
        '304': { $ref: '#/components/responses/NotModified' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Default' }

  /batches:
    get:
      tags: [catalog]
      operationId: listBatches
      summary: List YC batches (W25, S25, W26, …)
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control:
              schema: { type: string }
              example: 'public, max-age=60'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchList' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        default: { $ref: '#/components/responses/Default' }

  /batches/{batch_id}:
    get:
      tags: [catalog]
      operationId: getBatch
      summary: Batch detail
      security: []
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control:
              schema: { type: string }
              example: 'public, max-age=60'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Batch' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        default: { $ref: '#/components/responses/Default' }

  /companies:
    get:
      tags: [catalog]
      operationId: listCompanies
      summary: Dashboard list (sortable, filterable)
      description: |
        Powers the P06 dense leaderboard. Filters by batch, status, and
        takedown state. `sort` accepts a comma-separated list of fields with
        optional `-` prefix for descending. Companies in
        `takedown_state=removed` are excluded by default.

        **Performance contract (B7):** the server MUST resolve `current_run`
        for every row via a single `LEFT JOIN` (Prisma
        `include: { currentRun: true }`). Per-row run queries are forbidden.
        An integration test asserts via `EXPLAIN ANALYZE` that the query count
        is ≤2 logical queries (1 for companies + currentRun, 1 for
        `total_estimate` if not cached) regardless of row count.

        **Sort contract (B8):** only indexed columns are sortable
        (`name`, `final_spec_fit`, `started_at`, `total_cost_cents`,
        `hires_posted_count`). Requests for non-indexed columns return `400`
        with `code=request.invalid_sort`. Cursor encoding is
        `base64url(JSON.stringify({k: <sort_key_value>, id: <row_id>}))`
        with `id` as deterministic tiebreaker. Multi-key sort encodes the
        full key tuple plus `id`.

        **Sparse fieldset (SC6 medium):** response items use the lean
        `CompanyListItem` schema (drops description/version/timestamps).
        Clients that need the full `Company` should fetch
        `/companies/{slug}`.
      security: []
      parameters:
        - in: query
          name: batch_id
          schema: { type: string }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/CompanyStatus' }
        - in: query
          name: include_removed
          schema: { type: boolean, default: false }
        - in: query
          name: sort
          description: |
            Comma-separated. Allowed: `name`, `-name`, `final_spec_fit`,
            `-final_spec_fit`, `started_at`, `-started_at`,
            `total_cost_cents`, `-total_cost_cents`, `hires_posted_count`,
            `-hires_posted_count`. Any other field triggers 400
            `request.invalid_sort`.
          schema:
            type: string
            default: '-final_spec_fit'
            pattern: '^-?[a-z_]+(,-?[a-z_]+){0,3}$'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control:
              schema: { type: string }
              example: 'public, max-age=60'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyList' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        default: { $ref: '#/components/responses/Default' }

  /companies/{slug}:
    get:
      tags: [catalog]
      operationId: getCompany
      summary: Company detail (with current run summary)
      security: []
      parameters:
        - $ref: '#/components/parameters/CompanySlug'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control:
              schema: { type: string }
              example: 'public, max-age=60'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        default: { $ref: '#/components/responses/Default' }

  /companies/{slug}/runs:
    get:
      tags: [pipeline]
      operationId: listCompanyRuns
      summary: Runs for this company (most recent first)
      security: []
      parameters:
        - $ref: '#/components/parameters/CompanySlug'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control:
              schema: { type: string }
              example: 'public, max-age=60'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunList' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        default: { $ref: '#/components/responses/Default' }

  /runs/{run_id}:
    get:
      tags: [pipeline]
      operationId: getRun
      summary: Run detail
      description: |
        Returns final spec-fit, status, cost, and the (possibly expired)
        deploy URL. If `deploy_expires_at` is in the past or
        `deploy_revoked_at` is set, `deploy_url` is omitted from the response.

        Cache-Control varies by status: terminal states (`converged`,
        `ceiling_hit`, `failed`, `aborted`) return
        `public, max-age=31536000, immutable` with a content-hash ETag;
        non-terminal states return `public, max-age=30` with an
        `(id, updated_at)` ETag.

        Server SHOULD emit `Warning: 299 - "run terminated without convergence"`
        when status is `ceiling_hit` or `aborted` so clients (and SR users via
        the M21 a11y layer) can surface honest narration (S3, SC3 medium).
      security: []
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control:
              schema: { type: string }
              example: 'public, max-age=30'
            Warning:
              schema: { type: string }
              description: |
                Sent when status ∈ {`ceiling_hit`, `aborted`}: `Warning: 299 -
                "run terminated without convergence"`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        default: { $ref: '#/components/responses/Default' }

  /runs/{run_id}/iterations:
    get:
      tags: [pipeline]
      operationId: listRunIterations
      summary: Iteration timeline (with parent_iter_id lineage)
      description: |
        Returns iterations in `idx` order. `parent_iter_id` encodes regen
        lineage (M12) — when the loop regens a single flow, the new iteration
        points back to the parent it inherited from.
      security: []
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control:
              schema: { type: string }
              example: 'public, max-age=60'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IterationList' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        default: { $ref: '#/components/responses/Default' }

  /iterations/{iter_id}:
    get:
      tags: [pipeline]
      operationId: getIteration
      summary: Single iteration (first-class — H-D3)
      description: |
        First-class iteration access. Iteration ids are globally unique cuids;
        we surface a top-level path in addition to the nested
        `/runs/{run_id}/iterations` listing. The response includes
        `links.run` and `links.audit` so clients can navigate without a
        separate lookup (H-D4).
      security: []
      parameters:
        - $ref: '#/components/parameters/IterId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control:
              schema: { type: string }
              example: 'public, max-age=60'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Iteration' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        default: { $ref: '#/components/responses/Default' }

  /iterations/{iter_id}/audit:
    get:
      tags: [pipeline]
      operationId: getIterationAudit
      summary: Phoenix audit (trace ids + judge verdict)
      description: |
        Returns the OpenInference trace ID(s) recorded in Phoenix Cloud for
        this iteration plus the LLM-as-judge verdict for the same iteration.

        **Pure DB read (B9 + H-E1):** This endpoint MUST be a single Postgres
        read of `Iteration` joined to `JudgeVerdict`. It MUST NOT issue any
        outbound call to Phoenix Cloud at request time — `phoenix_console_url`
        is constructed in-app from a templated base URL plus the stored
        `trace_id`. Because there is no live Phoenix dependency, this endpoint
        does NOT return 503 (the only 503 paths are `/health` and `/stats`).
      security: []
      parameters:
        - $ref: '#/components/parameters/IterId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control:
              schema: { type: string }
              example: 'public, max-age=300'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IterationAudit' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        default: { $ref: '#/components/responses/Default' }

  /judge/prompts/{version}:
    get:
      tags: [judge]
      operationId: getJudgePrompt
      summary: Verbatim LLM-as-judge prompt by version (M10)
      description: |
        Returns the immutable judge prompt at `{version}` (e.g. `v1`) as
        Markdown or JSON via content negotiation. Source of truth is
        `/eval/judge_prompt.{version}.md` in the repo. Versioning is explicit
        and append-only — never edit in place. New versions are new rows in
        the `JudgePrompt` table with a fresh `frozen_at`.

        ETag is the SHA-256 of `body.text` (immutable content hash);
        `Vary: Accept` so the markdown and JSON representations cache
        independently.
      security: []
      parameters:
        - in: path
          name: version
          required: true
          schema:
            type: string
            pattern: '^v[0-9]+$'
            example: 'v1'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control:
              schema: { type: string }
              example: 'public, max-age=31536000, immutable'
            Vary:
              schema: { type: string }
              example: 'Accept'
          content:
            text/markdown:
              schema:
                type: string
                description: |
                  Verbatim Markdown body. The prompt itself is authored in
                  English (BCP-47 `en`); see SPEC.md "Deferred to v2 follow-up"
                  for the i18n posture.
            application/json:
              schema: { $ref: '#/components/schemas/JudgePrompt' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406':
          description: 'Requested representation not available; only `text/markdown` and `application/json` are supported.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        default: { $ref: '#/components/responses/Default' }

  /comments:
    get:
      tags: [social]
      operationId: listComments
      summary: Read-only seed reactions for a company (P15 wall)
      description: |
        Hand-curated seed comments. **Not user-generated** — there is no POST
        endpoint and no moderation queue. `kind` distinguishes reactions
        sourced from public posts (`public_quote`) vs. internal team notes
        (`team_note`).

        Each comment carries `company_slug` so clients can build company URLs
        without an extra lookup (H-D4) and a `links.company` reference.
      security: []
      parameters:
        - in: query
          name: company_slug
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control:
              schema: { type: string }
              example: 'public, max-age=60'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentList' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        default: { $ref: '#/components/responses/Default' }

components:
  parameters:
    Cursor:
      in: query
      name: cursor
      description: |
        Opaque cursor. Encoded as `base64url(JSON({k, id}))` where `k` is the
        sort key value tuple and `id` is the row id tiebreaker (B8). Clients
        SHOULD treat this as opaque.
      schema: { type: string }
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    BatchId:
      in: path
      name: batch_id
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9]{16,32}$|^[WS][0-9]{2}$'
    CompanySlug:
      in: path
      name: slug
      required: true
      description: |
        Slug normalization rule (SC4 medium): lowercased, ASCII-only,
        hyphen-separated; normalized at ingest from the YC company name
        (NFKC → strip diacritics → lowercase → replace `[^a-z0-9]` with `-`
        → trim leading/trailing `-`).
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
    RunId:
      in: path
      name: run_id
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9]{16,32}$'
    IterId:
      in: path
      name: iter_id
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9]{16,32}$'
    IfNoneMatch:
      in: header
      name: If-None-Match
      schema: { type: string }
      description: |
        Conditional revalidation per RFC 9110 §13.1.2. If the value matches
        the current resource ETag, server responds `304 Not Modified` with
        `ETag` and `Cache-Control` headers and an empty body.

  headers:
    ETag:
      schema: { type: string }
      description: |
        Strong ETag. Derivation depends on resource (see top-level description
        "ETag derivation strategy"). Always quoted; e.g. `"sha256:abc123…"`
        for content-hash ETags or `"r:cuid123:1715000000"` for
        `(id, updated_at)` ETags.
    RetryAfter:
      schema: { type: integer, minimum: 0 }
      description: |
        Seconds the client SHOULD wait before retrying. Sent on `429` and
        `503` responses (RFC 7231 §7.1.3 / RFC 9110 §10.2.3).

  responses:
    NotModified:
      description: |
        Resource has not changed since `If-None-Match`. Body is empty. `ETag`
        and `Cache-Control` headers are echoed.
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
        Cache-Control:
          schema: { type: string }
    BadRequest:
      description: Bad Request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            invalidSort:
              summary: invalid sort field
              value:
                type: 'https://whyc.example/problems/request-invalid-sort'
                title: 'Invalid sort field'
                status: 400
                code: 'request.invalid_sort'
                detail: "Unknown sort field 'foo'. Allowed: name, final_spec_fit, started_at, total_cost_cents, hires_posted_count."
                instance: 'urn:trace:abc123'
            invalidCursor:
              summary: malformed cursor
              value:
                type: 'about:blank'
                title: 'Invalid cursor'
                status: 400
                code: 'request.invalid_cursor'
                detail: 'Cursor failed base64url + JSON decode.'
                instance: 'urn:trace:abc123'
    NotFound:
      description: Not Found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            companyNotFound:
              value:
                type: 'https://whyc.example/problems/company-not-found'
                title: 'Company not found'
                status: 404
                code: 'company.not_found'
                detail: 'No company with slug=foo'
                instance: 'urn:trace:abc123'
    Gone:
      description: |
        Resource was permanently removed via takedown
        (`company.takedown_removed`) or its preview deploy expired beyond the
        retention window (`deploy.expired`). The `Problem.code` extension
        distinguishes the cause; clients SHOULD NOT retry. (B4)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            takedown:
              summary: company removed via takedown
              value:
                type: 'https://whyc.example/problems/company-takedown-removed'
                title: 'Company removed'
                status: 410
                code: 'company.takedown_removed'
                detail: 'This company was removed in response to a takedown request.'
                instance: 'urn:trace:abc123'
            deployExpired:
              summary: deploy URL expired
              value:
                type: 'https://whyc.example/problems/deploy-expired'
                title: 'Deploy expired'
                status: 410
                code: 'deploy.expired'
                detail: 'The 24-hour preview window has elapsed.'
                instance: 'urn:trace:abc123'
    UnprocessableEntity:
      description: |
        Syntactically valid but semantically rejected (e.g. mutually exclusive
        filter combo). `Problem.code` is `request.unprocessable`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: |
        Rate limit hit. Cloud Armor enforces 60 req/min/IP on companies/runs
        endpoints, 600 req/min/IP on health/stats. (H-S4)
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalServerError:
      description: Internal Server Error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: |
        DB unreachable. Only emitted by `/health` and `/stats` (the only
        endpoints with a hard DB dependency at request time — every other
        endpoint reads the same DB but degrades to 500 on connection
        failure). Phoenix Cloud outages do NOT trigger 503 (B9 + H-E1).
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Default:
      description: |
        Unexpected error. Always `application/problem+json` with a `code`
        extension drawn from the SPEC.md §8.1 error catalog.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: |
        RFC 7807 Problem Details with the WhyC `code` extension (B3). The
        `code` field is a closed enum drawn from SPEC.md §8.1 error catalog;
        see `pattern` below for syntax.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: |
            Problem type URI. Defaults to `about:blank` when no specific URL
            is meaningful (RFC 7807 §3.1, SC3 medium).
          example: 'https://whyc.example/problems/not-found'
          default: 'about:blank'
        title:
          type: string
          example: 'Resource not found'
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
          description: |
            Stable correlation identifier. Format `urn:trace:<id>` where
            `<id>` matches the request's Phoenix trace id when applicable
            (SC3 low: trace correlation).
        code:
          type: string
          description: |
            Closed-vocabulary error code (B3). Pattern is
            `^[a-z]+(\.[a-z_]+)+$`. See SPEC.md §8.1 error catalog for the
            authoritative list.
          pattern: '^[a-z]+(\.[a-z_]+)+$'
          example: 'company.not_found'

    Health:
      type: object
      required: [status, version, server_time]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string, example: '1.0.0' }
        commit_sha: { type: string }
        db_ok: { type: boolean }
        phoenix_reachable:
          type: boolean
          description: |
            Last cached probe of Phoenix Cloud (refreshed by an internal
            cron, NOT by this request — B9). Surfaces SaaS health for the
            dashboard banner without making a live call from the API.
        server_time:
          type: string
          format: date-time
          description: 'Server clock anchor (UTC, ISO 8601 with trailing Z).'
        checked_at:
          type: string
          format: date-time

    LocalizedString:
      type: object
      description: |
        User-visible natural-language string with explicit BCP-47 language
        tag (H-A4 / SC4). Default language is `en` for v1; the schema is
        future-proof for translation.
      required: [text, language]
      properties:
        text:
          type: string
        language:
          type: string
          pattern: '^[a-zA-Z]{2,3}(-[A-Z]{2})?$'
          example: 'en'
          default: 'en'

    CompanyDescription:
      type: object
      description: |
        Public-source description of the company. Per M4 supersede, when
        present this object MUST include `source_url` (citation) — enforced
        by the required-list and a Postgres CHECK constraint (B11):
          `(description_text IS NULL) OR
           (description_source_url IS NOT NULL
            AND description_source_url ~ '^https?://')`.
        Splits B11 (citation enforcement) and SC1 a11y (language tag) into a
        single nested object: presence of any field implies presence of all.
      required: [text, source_url, language]
      properties:
        text:
          type: string
          maxLength: 2000
        source_url:
          type: string
          format: uri
          pattern: '^https?://'
          description: 'Public URL the description is quoted from. Required when text is present.'
        language:
          type: string
          pattern: '^[a-zA-Z]{2,3}(-[A-Z]{2})?$'
          default: 'en'
          example: 'en'

    PublicStats:
      type: object
      description: |
        Numbers-only ledger for the landing receipts section (M4
        receipts-only framing). All monetary fields are integers in the
        `currency_code` minor unit (USD-cents). All time fields are integers
        in the named SI unit. SR phrasing guidance is documented per-field.
      required:
        - total_companies_ingested
        - total_runs_completed
        - total_shipped
        - total_no_go
        - median_ship_time_seconds
        - median_run_cost_cents
        - currency_code
        - unit
        - generated_at
        - server_time
      properties:
        total_companies_ingested: { type: integer, format: int64, minimum: 0 }
        total_runs_completed: { type: integer, format: int64, minimum: 0 }
        total_shipped:
          type: integer
          format: int64
          minimum: 0
          description: 'Runs with status=converged AND deploy URL still active or expired (not failed).'
        total_no_go: { type: integer, format: int64, minimum: 0 }
        median_ship_time_seconds:
          type: integer
          format: int64
          minimum: 0
          description: |
            Median wall-clock from run start to converged across last 30 days.
            **SR phrasing (B2):** render as `<minutes> minutes <seconds> seconds`,
            e.g. "37 minutes 12 seconds" — never `37:12`.
        median_run_cost_cents:
          type: integer
          format: int64
          minimum: 0
          description: |
            Median end-to-end run cost in `currency_code` minor unit.
            **SR phrasing (B2):** render as `<X> dollars and <Y> cents`,
            e.g. "0 dollars and 4 cents" — never `$0.04`.
        currency_code:
          type: string
          description: |
            ISO 4217 currency code for all *_cents fields. Fixed `USD` in v1.
            (H-I1). When v2 introduces a non-USD batch, this becomes
            non-constant; clients MUST read `currency_code` per-response.
          enum: [USD]
          default: USD
        unit:
          type: object
          description: 'Per-field unit annotations for SR/i18n consumers (B2).'
          required: [median_ship_time_seconds, median_run_cost_cents]
          properties:
            median_ship_time_seconds:
              type: string
              enum: [seconds]
              default: seconds
            median_run_cost_cents:
              type: string
              enum: [usd_cents]
              default: usd_cents
        generated_at:
          type: string
          format: date-time
          description: 'When the underlying PublicStatsSnapshot was rebuilt (UTC, ISO 8601 Z).'
        server_time:
          type: string
          format: date-time
          description: 'Server clock at response time (UTC, ISO 8601 Z).'

    CompanyStatus:
      type: string
      enum: [ingested, analyzing, no_go, building, deployed, converged, failed]
      description: |
        Lifecycle. `ingested` → `analyzing` → either `no_go` (terminal) or
        `building` → `deployed` → `converged` (terminal) or `failed` (terminal).

    NoGoReason:
      type: string
      enum: [cost_over_ceiling, complexity_over_ceiling, ip_unsafe, not_demoable, regulated_domain]
      description: 'Mirrors Prisma enum `NoGoReason`.'

    TakedownState:
      type: string
      enum: [active, requested, removed]

    RegenFlow:
      type: string
      enum: [analyze, design, develop, deploy, full]
      description: 'Which flow the iteration regenerated.'

    RunStatus:
      type: string
      enum: [pending, running, converged, ceiling_hit, failed, aborted]

    SpecFitState:
      type: string
      enum: [converged, near, below_floor, pending, n_a]
      description: |
        SR-determinable label alongside the `final_spec_fit` float (B1).
        Mapping (with τ_converge=0.92, τ_floor=0.50 from SPEC.md §4):
          - `converged`   : score ≥ 0.92 AND judge label = pass → run converged
          - `near`        : 0.50 ≤ score < 0.92
          - `below_floor` : score < 0.50
          - `pending`     : run is still running, score not yet computed
          - `n_a`         : run aborted/failed before any verdict (e.g. `no_go`)
        **Canonical aria-label template:** `"Spec-fit <int>%, <label>"`,
        e.g. `"Spec-fit 87 percent, near convergence threshold of 92 percent"`.

    JudgeVerdictLabel:
      type: string
      enum: [pass, partial, fail]

    Page:
      type: object
      description: |
        Reusable list-envelope mixin (H-D2). Concrete list schemas use
        `allOf: [Page, { properties: { data: ... } }]`.
      required: [next_cursor, prev_cursor, window, applied_sort, available_sorts, server_time]
      properties:
        next_cursor:
          type: string
          nullable: true
          description: 'Opaque cursor for the next page; null at end.'
        prev_cursor:
          type: string
          nullable: true
          description: 'Opaque cursor for the previous page; null at start.'
        total_estimate:
          type: integer
          format: int64
          minimum: 0
          description: |
            Cached estimate of total result-set size (SC6 medium — optional).
            May be stale within the cache window; clients SHOULD NOT use as a
            source of truth. Server may omit when unavailable.
        window:
          type: object
          description: |
            SR window metadata (H-A2). `start_index` and `end_index` are
            1-based inclusive indices within the (possibly estimated) result
            set; `has_prev`/`has_next` are derived from cursor presence.
          required: [start_index, end_index, has_prev, has_next]
          properties:
            start_index: { type: integer, format: int64, minimum: 1 }
            end_index:   { type: integer, format: int64, minimum: 0 }
            total_estimate: { type: integer, format: int64, minimum: 0 }
            has_prev: { type: boolean }
            has_next: { type: boolean }
        applied_sort:
          type: array
          description: 'Echo of the sort actually applied, with SR labels (H-A3).'
          items:
            type: object
            required: [field, direction, label, aria_description]
            properties:
              field:    { type: string, example: 'final_spec_fit' }
              direction: { type: string, enum: [asc, desc] }
              label:    { type: string, example: 'Spec-fit' }
              aria_description:
                type: string
                example: 'Sorted by spec-fit, descending.'
        available_sorts:
          type: array
          description: 'Indexed sort columns available on this endpoint (B8 + H-A3).'
          items:
            type: object
            required: [field, label]
            properties:
              field: { type: string }
              label: { type: string }
        server_time:
          type: string
          format: date-time
          description: 'Server clock at response time (UTC, ISO 8601 Z).'

    Links:
      type: object
      description: 'Hypermedia links for cross-resource navigation (H-D4).'
      properties:
        self:        { type: string, format: uri-reference }
        run:         { type: string, format: uri-reference }
        company:     { type: string, format: uri-reference }
        audit:       { type: string, format: uri-reference }
        iterations:  { type: string, format: uri-reference }
        verdict:     { type: string, format: uri-reference }

    Batch:
      type: object
      required: [id, label, demo_day_at]
      properties:
        id: { type: string }
        label:
          type: string
          example: 'W26'
          description: 'YC batch label, e.g. W25, S25, W26.'
          pattern: '^[WS][0-9]{2}$'
        demo_day_at: { type: string, format: date }
        source_url: { type: string, format: uri }
        company_count: { type: integer, format: int64, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        links: { $ref: '#/components/schemas/Links' }

    BatchList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Batch' }

    Company:
      type: object
      required: [id, slug, name, batch_id, status, takedown_state, version]
      properties:
        id: { type: string }
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
        name:
          type: string
          description: |
            Plain-text company name. **No logo fields exist** (M4). Per M4
            supersede, names are real YC company names rendered in our own
            typography.
        name_pronunciation:
          type: string
          nullable: true
          description: |
            Optional phonetic hint for SR engines (H-A1). Stored when the
            ASCII spelling diverges from natural English pronunciation.
            Example: `"AY-roh-spike"` for "Aerospike".
        name_aria_label:
          type: string
          nullable: true
          description: 'Optional pre-built aria-label (H-A1). Falls back to `name`.'
        name_display_short:
          type: string
          nullable: true
          description: 'Optional short form for cramped UI (H-A1, e.g. dashboard sticky col).'
        batch_id: { type: string }
        batch_label: { type: string, example: 'W26' }
        description:
          allOf:
            - $ref: '#/components/schemas/CompanyDescription'
          nullable: true
          description: |
            Public-source description (B11). Replaces v0's flat
            `description_text` + `description_source_url` pair so the
            citation requirement is structurally enforced.
        hires_posted_count:
          type: integer
          format: int64
          minimum: 0
          description: |
            Engineer/intern hires posted on workatastartup.com at last check.
            **SR phrasing:** render as `<N> hires posted` (singular `1 hire posted`).
        last_hires_check_at:
          type: string
          format: date-time
          description: |
            Last time `hires_posted_count` was refreshed. **Excluded from
            ETag derivation** so the 6h refresh cron does not invalidate
            cache (B5).
        status: { $ref: '#/components/schemas/CompanyStatus' }
        no_go_reason:
          allOf:
            - $ref: '#/components/schemas/NoGoReason'
          nullable: true
          description: 'Set only when `status=no_go`.'
        takedown_state: { $ref: '#/components/schemas/TakedownState' }
        takedown_requested_at:
          type: string
          format: date-time
          nullable: true
        current_run:
          allOf:
            - $ref: '#/components/schemas/RunSummary'
          nullable: true
        version:
          type: integer
          format: int64
          minimum: 0
          description: |
            Optimistic-concurrency version (H-Y3). Increments on every
            takedown-state transition. Internal write paths use CAS:
            `UPDATE companies SET … WHERE id=? AND version=?`. Exposed
            read-only.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        links: { $ref: '#/components/schemas/Links' }

    CompanyListItem:
      type: object
      description: |
        Lean projection used by `/companies` to keep the dashboard payload
        small (SC6 medium). Drops description, name pronunciation extras,
        version, and full timestamps; keeps everything the leaderboard
        renders.
      required: [id, slug, name, batch_id, status, takedown_state]
      properties:
        id: { type: string }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
        name: { type: string }
        name_aria_label: { type: string, nullable: true }
        batch_id: { type: string }
        batch_label: { type: string, example: 'W26' }
        hires_posted_count: { type: integer, format: int64, minimum: 0 }
        status: { $ref: '#/components/schemas/CompanyStatus' }
        takedown_state: { $ref: '#/components/schemas/TakedownState' }
        current_run:
          allOf:
            - $ref: '#/components/schemas/RunSummary'
          nullable: true
        links: { $ref: '#/components/schemas/Links' }

    CompanyList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/CompanyListItem' }

    RunSummary:
      type: object
      required: [id, status, started_at, currency_code]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/RunStatus' }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        final_spec_fit:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
          description: |
            Deterministic spec-fit (SPEC.md §4). UI displays as
            `round(final_spec_fit * 100)` percent. **SR phrasing (B1 + B2):**
            render via `spec_fit_state` for the coarse label
            (e.g. "Spec-fit 87 percent, near convergence threshold of 92
            percent") rather than the raw float.
        spec_fit_state: { $ref: '#/components/schemas/SpecFitState' }
        spec_fit_sparkline:
          type: array
          description: |
            Per-iteration spec-fit history (H-P1). Max 7 points; index 0 is
            iteration 0. Populated by the pipeline writer; immutable after
            run completion. Empty array for `pending` runs.
          maxItems: 7
          items:
            type: number
            format: float
            minimum: 0
            maximum: 1
            nullable: true
        total_cost_cents:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: |
            Cumulative cost in `currency_code` minor unit. **SR phrasing:**
            see `PublicStats.median_run_cost_cents`.
        currency_code:
          type: string
          enum: [USD]
          default: USD
          description: 'ISO 4217 currency code for `total_cost_cents` and `cost_limit_cents`. (H-I1)'
        deploy_url:
          type: string
          format: uri
          nullable: true
          description: 'Omitted if `deploy_expires_at` has passed or `deploy_revoked_at` is set.'
        deploy_expires_at:
          type: string
          format: date-time
          nullable: true
        company_slug:
          type: string
          nullable: true
          description: 'Companion to company_id for URL building without a lookup (H-D4).'
        links: { $ref: '#/components/schemas/Links' }

    Run:
      allOf:
        - $ref: '#/components/schemas/RunSummary'
        - type: object
          required: [company_id, iter_limit, cost_limit_cents, judge_prompt_version]
          properties:
            company_id: { type: string }
            iter_limit:
              type: integer
              format: int64
              minimum: 1
              maximum: 7
              description: 'M7 hard ceiling.'
            cost_limit_cents:
              type: integer
              format: int64
              minimum: 0
              maximum: 500
              description: 'M7 hard ceiling ($5 in `currency_code` minor unit).'
            judge_prompt_version:
              type: string
              pattern: '^v[0-9]+$'
              example: 'v1'
              description: 'M10 — pinned at run start.'
            deploy_revoked_at:
              type: string
              format: date-time
              nullable: true
              description: |
                Set by `sweep_expired_deploys` cron when revocation is
                attempted (B10).
            deploy_revoked_confirmed_at:
              type: string
              format: date-time
              nullable: true
              description: |
                Distinct from `deploy_revoked_at` (B10): set only after the
                Cloud Run revision delete returns 200. Allows monitoring of
                cron-vs-actual drift; surfaced in `phoenix_reachable`-style
                dashboard health banner.
            iteration_count: { type: integer, format: int64, minimum: 0 }
            kickoff_key:
              type: string
              description: |
                Idempotency key for pipeline kickoff (B6). Format
                `${companyId}:${kickoffBatchId}`. Exposed read-only.
              pattern: '^[a-z0-9]+:[a-z0-9]+$'

    RunList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/RunSummary' }

    Iteration:
      type: object
      required: [id, run_id, idx, started_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        company_slug:
          type: string
          nullable: true
          description: 'Convenience for URL building without a lookup (H-D4).'
        idx:
          type: integer
          format: int64
          minimum: 0
          description: |
            0-based ordinal within the run. Assigned via `SELECT … FOR
            UPDATE` on the parent Run row (or pg_advisory_xact_lock keyed on
            `run_id`) before INSERT (H-Y1) so concurrent regen attempts
            cannot collide on `idx`.
        parent_iter_id:
          type: string
          nullable: true
          description: |
            M12 — regen lineage. Null for `idx=0`. **Lineage label (SC1
            medium):** UI renders this as `"Regenerated from iteration <idx>
            on <regen_flow> flow"`.
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }
        spec_fit:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
        spec_fit_state: { $ref: '#/components/schemas/SpecFitState' }
        regen_flow:
          allOf:
            - $ref: '#/components/schemas/RegenFlow'
          nullable: true
        cost_cents:
          type: integer
          format: int64
          minimum: 0
        currency_code:
          type: string
          enum: [USD]
          default: USD
        judge_verdict_id: { type: string, nullable: true }
        phoenix_trace_id:
          type: string
          nullable: true
          description: |
            Primary OpenInference trace id pinned at iteration creation
            (SC5 medium: collision rule on regen — a regenerated iteration
            gets a fresh trace id, never reuses the parent's).
        phoenix_trace_ids:
          type: array
          items: { type: string }
          description: 'Full set if the span tree splits.'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        links: { $ref: '#/components/schemas/Links' }

    IterationList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [data, count]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Iteration' }
            count:
              type: integer
              format: int64
              minimum: 0
              description: |
                Exact count (H-D2 — iterations per run are bounded by
                `iter_limit ≤ 7` so we can return exact, not estimated).

    JudgeVerdict:
      type: object
      required: [id, iteration_id, judge_prompt_version, score, label]
      properties:
        id: { type: string }
        iteration_id: { type: string }
        judge_prompt_version:
          type: string
          pattern: '^v[0-9]+$'
          example: 'v1'
        score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 'Same scale as spec_fit.'
        spec_fit_state: { $ref: '#/components/schemas/SpecFitState' }
        label: { $ref: '#/components/schemas/JudgeVerdictLabel' }
        verdict_json:
          type: object
          description: 'Per-flow breakdown (analyze/design/develop/deploy → score).'
          additionalProperties: true
        trace_id:
          type: string
          nullable: true
          description: |
            Phoenix trace id of the judge call itself (distinct from the
            iteration trace).
        created_at: { type: string, format: date-time }

    IterationAudit:
      type: object
      required: [iteration_id, phoenix_trace_ids]
      properties:
        iteration_id: { type: string }
        phoenix_trace_ids:
          type: array
          items: { type: string }
          description: 'All OpenInference trace IDs that comprise this iteration''s span tree.'
        phoenix_project: { type: string, example: 'whyc-prod' }
        phoenix_console_url:
          type: string
          format: uri
          description: |
            Deep link to the Phoenix Cloud console (read-only). Constructed
            in-app from a templated base URL + stored trace_id; this endpoint
            does NOT call Phoenix at request time (B9). The link opens in a
            new tab; UI MUST set `rel="noopener noreferrer"` and announce
            "(opens in a new window)" for SR (SC1 medium).
        judge_verdict:
          $ref: '#/components/schemas/JudgeVerdict'
        spec_fit_components:
          type: object
          description: 'Per-axis breakdown that fed the deterministic spec-fit formula (SPEC.md §4).'
          properties:
            axis_extraction:     { type: number, format: float, minimum: 0, maximum: 1 }
            axis_design:         { type: number, format: float, minimum: 0, maximum: 1 }
            axis_implementation: { type: number, format: float, minimum: 0, maximum: 1 }
            axis_deploy:         { type: number, format: float, minimum: 0, maximum: 1 }
        links: { $ref: '#/components/schemas/Links' }

    JudgePrompt:
      type: object
      required: [version, body, sha256, frozen_at]
      properties:
        version:
          type: string
          pattern: '^v[0-9]+$'
          example: 'v1'
        body:
          allOf:
            - $ref: '#/components/schemas/LocalizedString'
          description: |
            Verbatim Markdown body of `/eval/judge_prompt.{version}.md` plus
            language tag (BCP-47, default `en` — SC4 medium).
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: 'Hex SHA-256 of `body.text` for tamper-evidence.'
        frozen_at: { type: string, format: date-time }

    Comment:
      type: object
      required: [id, company_id, kind, body, posted_at]
      properties:
        id: { type: string }
        company_id: { type: string }
        company_slug:
          type: string
          nullable: true
          description: 'Companion to company_id for URL building (H-D4).'
        kind:
          type: string
          enum: [public_quote, team_note]
          description: '`public_quote` cites a public source; `team_note` is internal commentary.'
        body:
          allOf:
            - $ref: '#/components/schemas/LocalizedString'
          description: 'Comment text with BCP-47 language tag (default `en`, H-A4).'
        author_handle:
          type: string
          nullable: true
          description: 'Handle as it appears in the cited public source, or null for team_note.'
        source_url:
          type: string
          format: uri
          pattern: '^https?://'
          nullable: true
          description: 'Required when `kind=public_quote` (enforced in service layer).'
        posted_at: { type: string, format: date-time }
        links: { $ref: '#/components/schemas/Links' }

    CommentList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Comment' }

# Read-only API: no auth on public endpoints.
security: []
