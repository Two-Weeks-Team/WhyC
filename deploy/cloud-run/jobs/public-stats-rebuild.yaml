# Cloud Run Job: public_stats_rebuild
# Trigger: Cloud Scheduler, nightly at 03:00 UTC.  (SPEC §7)
# Rebuilds the cached snapshot powering GET /api/v1/stats (landing receipts band).
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: whyc-public-stats-rebuild
  namespace: PROJECT_ID
  labels:
    app: whyc
    tier: job
    cron: "nightly"
spec:
  template:
    spec:
      parallelism: 1
      taskCount: 1
      template:
        spec:
          serviceAccountName: whyc-jobs-writer@PROJECT_ID.iam.gserviceaccount.com
          maxRetries: 2
          timeoutSeconds: 600    # 10 min cap
          containers:
            - name: public-stats-rebuild
              image: REGION-docker.pkg.dev/PROJECT_ID/whyc/whyc-api:GIT_SHA
              command: ["node", "apps/api/dist/jobs/public-stats-rebuild.js"]
              resources:
                limits:
                  cpu: "1"
                  memory: 512Mi
              env:
                - name: NODE_ENV
                  value: production
                - name: JOB_NAME
                  value: public_stats_rebuild
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: whyc-database-url-writer
                      key: latest
